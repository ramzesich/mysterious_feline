<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bumbot</title>
    <style>
        body {
            margin: 0;
            background: #111;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: white;
        }
        #gameWindow {
            position: relative;
            width: 700px;
            height: 350px;
            background: linear-gradient(#1a1c2e, #0f101b);
            border: 4px solid #333;
            border-radius: 10px;
            overflow: hidden;
        }
        #world {
            position: absolute;
            top: 0;
            left: 0;
            width: 5000px; 
            height: 100%;
        }
        #ground {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background: #222;
            border-top: 4px solid #444;
        }
        #catContainer {
            position: absolute;
            bottom: 40px;
            left: 50px;
            width: 50px;
            height: 50px;
            z-index: 10;
        }
        #cat {
            width: 100%;
            height: 100%;
            font-size: 45px;
            line-height: 50px;
            text-align: center;
            user-select: none;
            transform: scaleX(-1); 
            filter: brightness(0) drop-shadow(1px 0px 0px white) drop-shadow(-1px 0px 0px white) drop-shadow(0px 1px 0px white) drop-shadow(0px -1px 0px white);
        }
        #meowBubble {
            position: absolute;
            background: white;
            color: black;
            padding: 4px 8px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            bottom: 55px;
            left: -20px;
            display: none;
            z-index: 15;
            white-space: nowrap;
        }
        #meowBubble::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 35px;
            border-width: 5px 5px 0;
            border-style: solid;
            border-color: white transparent;
            display: block;
            width: 0;
        }
        .obstacle {
            position: absolute;
            bottom: 40px;
            width: 40px;
            background: #c0392b;
            border: 2px solid #e74c3c;
            border-radius: 4px;
        }
        .spike {
            position: absolute;
            bottom: 40px;
            width: 30px;
            height: 15px;
            background: #f1c40f;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            border: 1px solid #f39c12;
        }
        .platform {
            position: absolute;
            background: #2980b9;
            border: 2px solid #3498db;
            border-radius: 4px;
            height: 15px;
        }
        .instructions {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: #888;
            z-index: 30;
            user-select: none;
        }
    </style>
</head>
<body>

<div id="gameWindow">
    <div id="world">
        <div id="ground"></div>
        <div id="catContainer">
            <div id="meowBubble">I am Bumbot!</div>
            <div id="cat">🐈‍⬛</div>
        </div>
    </div>
    <div class="instructions">Click inside box first! Then use: [← / →] Move &nbsp;&nbsp;&nbsp;&nbsp; [Space / ↑] Jump &nbsp;&nbsp;&nbsp;&nbsp; [M] Talk</div>
</div>
<script>
    const world = document.getElementById('world');
    const catContainer = document.getElementById('catContainer');
    const cat = document.getElementById('cat');
    const meowBubble = document.getElementById('meowBubble');

    const worldWidth = 5000;
    const windowWidth = 700;

    const keys = { ArrowLeft: false, ArrowRight: false, ArrowUp: false, Space: false };

    let catX = 50;
    let catY = 0;
    let velocityY = 0;
    let isGrounded = true;
    
    const moveSpeed = 5;
    const gravity = 0.6;
    const jumpForce = 13;

    let audioCtx = null;
    function playMeowSound() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(450, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(850, audioCtx.currentTime + 0.08);
        osc.frequency.exponentialRampToValueAtTime(650, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
    }

    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.code === 'Space') {
            e.preventDefault(); 
            const keyName = e.code === 'Space' ? 'Space' : e.key;
            keys[keyName] = true;
        }
        if (e.code === 'KeyM') triggerMeow();
    });

    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.code === 'Space') {
            const keyName = e.code === 'Space' ? 'Space' : e.key;
            keys[keyName] = false;
        }
    });

    function triggerMeow() {
        playMeowSound();
        meowBubble.style.display = 'block';
        setTimeout(() => { meowBubble.style.display = 'none'; }, 600);
    }

    // Fixed 5000px Object Matrix
    const levelObjects = [
        { type: 'pillar', x: 300, width: 40, height: 40 },
        { type: 'pillar', x: 750, width: 40, height: 60 },
        { type: 'pillar', x: 1600, width: 40, height: 50 },
        { type: 'pillar', x: 2300, width: 40, height: 90 },
        { type: 'pillar', x: 3400, width: 40, height: 50 },
        { type: 'pillar', x: 4200, width: 40, height: 70 },
        { type: 'spike', x: 500, width: 30, height: 15 },
        { type: 'spike', x: 1200, width: 30, height: 15 },
        { type: 'spike', x: 1900, width: 30, height: 15 },
        { type: 'spike', x: 2800, width: 30, height: 15 },
        { type: 'spike', x: 3800, width: 30, height: 15 },
        { type: 'spike', x: 4500, width: 30, height: 15 },
        { type: 'platform', x: 950, width: 120, height: 80 },
        { type: 'platform', x: 1150, width: 100, height: 130 },
        { type: 'platform', x: 2050, width: 150, height: 90 },
        { type: 'platform', x: 2500, width: 120, height: 75 },
        { type: 'platform', x: 3000, width: 200, height: 100 },
        { type: 'platform', x: 3600, width: 120, height: 85 }
    ];

    function generateLevel() {
        levelObjects.forEach(obj => {
            const element = document.createElement('div');
            if (obj.type === 'pillar') {
                element.classList.add('obstacle');
                element.style.left = obj.x + 'px';
                element.style.height = obj.height + 'px';
            } else if (obj.type === 'spike') {
                element.classList.add('spike');
                element.style.left = obj.x + 'px';
            } else if (obj.type === 'platform') {
                element.classList.add('platform');
                element.style.left = obj.x + 'px';
                element.style.width = obj.width + 'px';
                element.style.bottom = (40 + obj.height) + 'px';
            }
            world.appendChild(element);
        });
    }
    function checkSolidCollision(targetX, targetY) {
        const catWidth = 35; 
        const catHeight = 45;
        for (let obj of levelObjects) {
            if (obj.type === 'spike') continue;
            let objMinX = obj.x;
            let objMaxX = obj.x + obj.width;
            let objMinY = 0;
            let objMaxY = obj.height;
            if (obj.type === 'platform') {
                objMinY = obj.height;
                objMaxY = obj.height + 15;
            }
            if (targetX < objMaxX && targetX + catWidth > objMinX && targetY < objMaxY && targetY + catHeight > objMinY) {
                return obj;
            }
        }
        return null;
    }

    function checkHazardCollision() {
        const catWidth = 35;
        const catHeight = 45;
        for (let obj of levelObjects) {
            if (obj.type !== 'spike') continue;
            if (catX < obj.x + obj.width && catX + catWidth > obj.x && catY < obj.height && catY + catHeight > 0) {
                return true;
            }
        }
        return false;
    }

    function update() {
        if (keys.ArrowRight) {
            cat.style.transform = 'scaleX(-1)'; 
            if (!checkSolidCollision(catX + moveSpeed, catY)) catX += moveSpeed;
            if (catX > worldWidth - 50) catX = worldWidth - 50;
        }
        if (keys.ArrowLeft) {
            cat.style.transform = 'scaleX(1)'; 
            if (!checkSolidCollision(catX - moveSpeed, catY)) catX -= moveSpeed;
            if (catX < 0) catX = 0;
        }

        if ((keys.ArrowUp || keys.Space) && isGrounded) {
            velocityY = jumpForce;
            isGrounded = false;
        }

        if (!isGrounded) {
            velocityY -= gravity;
            let nextY = catY + velocityY;
            let hitObj = checkSolidCollision(catX, nextY);
            if (hitObj) {
                if (velocityY < 0) {
                    nextY = (hitObj.type === 'platform') ? hitObj.height + 15 : hitObj.height;
                    isGrounded = true;
                    velocityY = 0;
                } else {
                    velocityY = 0;
                    nextY = catY;
                }
            }
            catY = nextY;
            if (catY <= 0) {
                catY = 0;
                velocityY = 0;
                isGrounded = true;
            }
        } else {
            if (catY > 0 && !checkSolidCollision(catX, catY - 1)) {
                isGrounded = false;
                velocityY = 0;
            }
        }

        if (checkHazardCollision()) {
            catX = 50;
            catY = 0;
            velocityY = 0;
            isGrounded = true;
        }

        catContainer.style.left = catX + 'px';
        catContainer.style.bottom = (40 + catY) + 'px';

        let cameraX = catX - (windowWidth / 2) + 25;
        if (cameraX < 0) cameraX = 0;
        if (cameraX > worldWidth - windowWidth) cameraX = worldWidth - windowWidth;
        world.style.left = (-cameraX) + 'px';

        requestAnimationFrame(update);
    }

    generateLevel();
    requestAnimationFrame(update);
</script>
</body>
</html>
