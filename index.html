<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bumbot</title>
    <style>
        body {
            margin: 0;
            background: #111;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: white;
        }
        #gameWindow {
            position: relative;
            width: 700px;
            height: 350px;
            background: linear-gradient(#1a1c2e, #0f101b);
            border: 4px solid #333;
            border-radius: 10px;
            overflow: hidden;
        }
        #world {
            position: absolute;
            top: 0;
            left: 0;
            width: 2000px;
            height: 100%;
        }
        #ground {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background: #222;
            border-top: 4px solid #444;
        }
        #catContainer {
            position: absolute;
            bottom: 40px;
            left: 50px;
            width: 50px;
            height: 50px;
            z-index: 10;
        }
        #cat {
            width: 100%;
            height: 100%;
            font-size: 45px;
            line-height: 50px;
            text-align: center;
            user-select: none;
            transform: scaleX(-1); 
            /* FIXED: Combines solid black with a sharp, crisp thin white outline drop-shadow */
            filter: brightness(0) drop-shadow(1px 0px 0px white) drop-shadow(-1px 0px 0px white) drop-shadow(0px 1px 0px white) drop-shadow(0px -1px 0px white);
        }
        #meowBubble {
            position: absolute;
            background: white;
            color: black;
            padding: 4px 8px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            bottom: 55px;
            left: -20px; /* Adjusted slightly left to accommodate the longer text */
            display: none;
            z-index: 15;
            white-space: nowrap;
        }
        #meowBubble::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 35px; /* Moved the pointer triangle to align under the new bubble center */
            border-width: 5px 5px 0;
            border-style: solid;
            border-color: white transparent;
            display: block;
            width: 0;
        }
        .obstacle {
            position: absolute;
            bottom: 40px;
            width: 40px;
            background: #c0392b;
            border: 2px solid #e74c3c;
            border-radius: 4px;
        }
        .instructions {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: #888;
            z-index: 30;
            user-select: none;
        }
    </style>
</head>
<body>

<div id="gameWindow">
    <div id="world">
        <div id="ground"></div>
        <div id="catContainer">
            <!-- FIXED: Updated dialogue text -->
            <div id="meowBubble">I am Bumbot!</div>
            <div id="cat">🐈‍⬛</div>
        </div>
    </div>
    <div class="instructions">Click inside box first! Then use: [← / →] Move &nbsp;&nbsp;&nbsp;&nbsp; [Space / ↑] Jump &nbsp;&nbsp;&nbsp;&nbsp; [M] Talk</div>
</div>

<script>
    const world = document.getElementById('world');
    const catContainer = document.getElementById('catContainer');
    const cat = document.getElementById('cat');
    const meowBubble = document.getElementById('meowBubble');

    const worldWidth = 2000;
    const windowWidth = 700;

    const keys = {
        ArrowLeft: false,
        ArrowRight: false,
        ArrowUp: false,
        Space: false
    };

    let catX = 50;
    let catY = 0;
    let velocityY = 0;
    let isGrounded = true;
    
    const moveSpeed = 5;
    const gravity = 0.6;
    const jumpForce = 12;

    let audioCtx = null;
    function playMeowSound() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(450, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(850, audioCtx.currentTime + 0.08);
        osc.frequency.exponentialRampToValueAtTime(650, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
    }

    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.code === 'Space') {
            e.preventDefault(); 
            const keyName = e.code === 'Space' ? 'Space' : e.key;
            keys[keyName] = true;
        }
        if (e.code === 'KeyM') {
            triggerMeow();
        }
    });

    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.code === 'Space') {
            const keyName = e.code === 'Space' ? 'Space' : e.key;
            keys[keyName] = false;
        }
    });

    function triggerMeow() {
        playMeowSound();
        meowBubble.style.display = 'block';
        setTimeout(() => { meowBubble.style.display = 'none'; }, 600); // Kept it visible slightly longer to read the sentence
    }

    const obstaclesData = [
        { x: 300, width: 40, height: 40 },
        { x: 550, width: 40, height: 60 },
        { x: 800, width: 40, height: 50 },
        { x: 1100, width: 40, height: 70 },
        { x: 1400, width: 40, height: 45 },
        { x: 1700, width: 40, height: 65 }
    ];

    function generateLevel() {
        obstaclesData.forEach(obs => {
            const element = document.createElement('div');
            element.classList.add('obstacle');
            element.style.left = obs.x + 'px';
            element.style.height = obs.height + 'px';
            world.appendChild(element);
        });
    }

    function checkCollision(targetX, targetY) {
        const catWidth = 35; 
        const catHeight = 45;

        for (let obs of obstaclesData) {
            if (
                targetX < obs.x + obs.width &&
                targetX + catWidth > obs.x &&
                targetY < obs.height &&
                targetY + catHeight > 0
            ) {
                return true; 
            }
        }
        return false;
    }

    function update() {
        // Horizontal Movement (Combines direction turning with our multi-shadow filter outline)
        if (keys.ArrowRight) {
            cat.style.transform = 'scaleX(-1)'; 
            if (!checkCollision(catX + moveSpeed, catY)) {
                catX += moveSpeed;
            }
            if (catX > worldWidth - 50) catX = worldWidth - 50;
        }
        if (keys.ArrowLeft) {
            cat.style.transform = 'scaleX(1)'; 
            if (!checkCollision(catX - moveSpeed, catY)) {
                catX -= moveSpeed;
            }
            if (catX < 0) catX = 0;
        }

        // Vertical Movement & Gravity
        if ((keys.ArrowUp || keys.Space) && isGrounded) {
            velocityY = jumpForce;
            isGrounded = false;
        }

        if (!isGrounded) {
            velocityY -= gravity;
            let nextY = catY + velocityY;

            if (checkCollision(catX, nextY)) {
                if (velocityY < 0) {
                    for (let obs of obstaclesData) {
                        if (catX + 35 > obs.x && catX < obs.x + obs.width) {
                            nextY = obs.height;
                            break;
                        }
                    }
                    isGrounded = true;
                    velocityY = 0;
                } else {
                    velocityY = 0;
                    nextY = catY;
                }
            }

            catY = nextY;

            if (catY <= 0) {
                catY = 0;
                velocityY = 0;
                isGrounded = true;
            }
        } else {
            if (catY > 0 && !checkCollision(catX, catY - 1)) {
                isGrounded = false;
                velocityY = 0;
            }
        }

        catContainer.style.left = catX + 'px';
        catContainer.style.bottom = (40 + catY) + 'px';

        let cameraX = catX - (windowWidth / 2) + 25;
        if (cameraX < 0) cameraX = 0;
        if (cameraX > worldWidth - windowWidth) cameraX = worldWidth - windowWidth;
        
        world.style.left = (-cameraX) + 'px';

        requestAnimationFrame(update);
    }

    generateLevel();
    requestAnimationFrame(update);
</script>

</body>
</html>
