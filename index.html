<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bumbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="gameWindow">
    <!-- NEW: Parallax Cityscape Layers -->
    <div id="skyBg"></div>
    <div id="farBuildings"></div>
    <div id="nearBuildings"></div>
    <div id="damageFlash"></div>

    <div id="ui">
        <div id="energyDisplay">Batteries: 0</div>
    </div>
    <div id="world">
        <div id="ground"></div>
        <div id="extractionPad"></div>
        <div id="portal">🌀</div>
        <div id="catContainer">
            <div id="meowBubble">I am Bumbot!</div>
            <div id="cat">🐈‍⬛</div>
        </div>
    </div>
    <div id="winScreen">
        <h1 style="color: #2ecc71;">MISSION ACCOMPLISHED</h1>
        <p id="finalScore">Bumbot safely made it to the station core!</p>
        <button onclick="resetGame()">Replay Level</button>
    </div>
    <div class="instructions">[← / →] Move &nbsp;&nbsp;&nbsp;&nbsp; [Space / ↑] Jump &nbsp;&nbsp;&nbsp;&nbsp; [M] Sonic Bark (Shatter Red Pillars)</div>
</div>

<!-- Load Game Logic Files -->
<script src="map.js"></script>
<script src="game.js"></script>
</body>
</html>
