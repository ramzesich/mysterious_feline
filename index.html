<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bumbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="gameWindow">
    <!-- NEW: Parallax Cityscape Layers -->
    <div id="skyBg"></div>
    <div id="farBuildings"></div>
    <div id="nearBuildings"></div>

    <div id="ui">
        <div id="energyDisplay">Snacks: 0</div>
        <!-- Hidden until the catnip stash is found -->
        <div id="devPanel">
            <span id="telemetry"></span>
            <span id="catnipTag">🌿 CATNIP</span>
        </div>
    </div>
    <div id="world">
        <!-- Ground segments, pit voids and the portal checkpoint are generated per zone by game.js -->
        <!-- The goal: a cat feeder standing on the ground, stocked. Positioned by game.js. -->
        <div id="goalFeeder" class="feeder active">
            <div class="feeder-hopper"></div>
            <div class="feeder-led"></div>
            <div class="feeder-chute"></div>
            <div class="feeder-bowl"></div>
            <div class="feeder-kibble"></div>
        </div>
        <div id="catContainer">
            <div id="meowBubble">I am Bumbot!!!</div>
            <!-- Bumbot himself, drawn rather than typed: an emoji is whatever the host platform's
                 font vendor decided, and it can only be animated as one rigid lump. Every part
                 that moves is its own <g> with an id, driven by keyframes in style.css; the fills
                 are presentation attributes so this markup also renders standalone in sprite-lab.
                 Authored facing LEFT, like the emoji was, so --face keeps its meaning: -1 (the
                 default) mirrors him to face right. Paws sit on y=42, the bottom of the box, which
                 is why he needs no descender compensation. Back-to-front order = depth order. -->
            <div id="cat">
                <svg viewBox="0 0 50 42" aria-hidden="true">
                    <g id="bbTail">
                        <path d="M 40.5,19.5 C 45,17.5 48.2,13 46.6,7.2" fill="none"
                              stroke="#0b0b0f" stroke-width="3.4" stroke-linecap="round"/>
                    </g>
                    <g id="bbLegFrontFar">
                        <rect x="20.2" y="27" width="3.4" height="14" rx="1.7" fill="#05050a"/>
                        <ellipse cx="21.9" cy="40.9" rx="2.4" ry="1.4" fill="#05050a"/>
                    </g>
                    <g id="bbLegBackFar">
                        <rect x="28.4" y="27" width="3.4" height="14" rx="1.7" fill="#05050a"/>
                        <ellipse cx="30.1" cy="40.9" rx="2.4" ry="1.4" fill="#05050a"/>
                    </g>
                    <g id="bbTorso">
                        <path d="M 13,26 C 12,18.5 14.5,15.2 20,15.6 C 26,16.4 29,17.4 33,15.4
                                 C 38,13.6 42.2,16.2 42.2,22 C 42.2,28 38,30.2 33,29.8
                                 L 18,29.8 C 14.2,29.8 13,28 13,26 Z" fill="#0b0b0f"/>
                        <circle cx="35.6" cy="22.2" r="6.9" fill="#17171f"/>
                        <ellipse cx="17.6" cy="23.2" rx="5.2" ry="6.1" fill="#17171f"/>
                        <!-- Neck: a stroked line with round caps, so the head blends into the
                             shoulder. A polygon left a sharp wedge pointing into the chest. -->
                        <path d="M 11.6,15.4 L 16.8,21.6" fill="none" stroke="#0b0b0f"
                              stroke-width="8.4" stroke-linecap="round"/>
                    </g>
                    <g id="bbFur">
                        <!-- Fur standing on end. Hidden until .cat-spooked, which is the whole of
                             the death read now that the screen no longer flashes: spikes along the
                             back, from the shoulder to the haunch. -->
                        <path d="M 12.6,12.6 L 13.0,7.8 L 15.4,12.0 Z" fill="#0b0b0f"/>
                        <path d="M 16.0,15.6 L 17.4,10.8 L 19.0,15.2 Z" fill="#0b0b0f"/>
                        <path d="M 20.0,15.6 L 21.6,10.4 L 23.2,15.6 Z" fill="#0b0b0f"/>
                        <path d="M 24.2,16.2 L 25.6,11.0 L 27.4,16.0 Z" fill="#0b0b0f"/>
                        <path d="M 28.6,16.2 L 30.0,10.6 L 31.6,15.8 Z" fill="#0b0b0f"/>
                        <path d="M 32.6,15.4 L 34.2,10.2 L 35.8,14.8 Z" fill="#0b0b0f"/>
                        <path d="M 36.8,14.6 L 38.2,9.8 L 39.8,15.0 Z" fill="#0b0b0f"/>
                    </g>
                    <g id="bbLegFrontNear">
                        <rect x="15" y="27" width="4.1" height="14" rx="2" fill="#0b0b0f"/>
                        <ellipse cx="17.05" cy="41" rx="2.9" ry="1.6" fill="#0b0b0f"/>
                    </g>
                    <g id="bbLegBackNear">
                        <rect x="33.4" y="27" width="4.1" height="14" rx="2" fill="#0b0b0f"/>
                        <ellipse cx="35.45" cy="41" rx="2.9" ry="1.6" fill="#0b0b0f"/>
                    </g>
                    <g id="bbHead">
                        <g id="bbEar">
                            <path d="M 6.2,9 L 7.4,3.2 L 10.8,8.2 Z" fill="#0b0b0f"/>
                            <path d="M 11.4,8.4 L 13.8,4.0 L 15.2,9.4 Z" fill="#05050a"/>
                        </g>
                        <circle cx="10.2" cy="13.4" r="6" fill="#0b0b0f"/>
                        <ellipse cx="5.6" cy="15.4" rx="3.3" ry="2.7" fill="#17171f"/>
                        <g id="bbJaw">
                            <ellipse cx="6.0" cy="17.7" rx="2.6" ry="1.4" fill="#0b0b0f"/>
                        </g>
                    </g>
                </svg>
            </div>
        </div>
    </div>
    <div id="winScreen">
        <h1 style="color: #2ecc71;">MISSION ACCOMPLISHED</h1>
        <p id="finalScore">Bumbot safely made it to his lunch!</p>
        <button id="winButton" onclick="handleWinButton()">Replay Zone</button>
        <button id="winMenuButton" class="secondary" onclick="showStartMenu()">Main Menu</button>
    </div>
    <!-- The title card. Covers the window on load and after Main Menu, sitting over a real
         still frame of the zone rather than a flat colour — game.js builds the level and
         hand-draws one frame behind this, because the game loop is not running yet.
         #menuCat is filled in by game.js with a snapshot clone of Bumbot's sprite. -->
    <div id="startScreen">
        <div id="menuCat"></div>
        <h1 id="menuTitle">BUMBOT</h1>
        <button id="startButton" onclick="handleStartButton()">Start</button>
    </div>
</div>

<div class="instructions">[← / →] Move &nbsp;&nbsp;&nbsp;&nbsp; [Space / ↑] Jump &nbsp;&nbsp;&nbsp;&nbsp; [M] Sonic Meow (Uses Snacks)</div>

<!-- The pigeon that struts the deck, cloned once per walking bird by generateLevel(). A template
     rather than a live node because there are many of them, and its parts carry *classes* rather
     than ids for the same reason — ids would be duplicated across every bird on the roof.
     Authored facing LEFT like Bumbot, so --wing keeps its meaning, in a 40x40 box with the feet
     at the bottom. Real pigeon greys instead of a silhouette: with geometry we control there is
     no pale-headed glyph artwork to fight, so the flattening filter goes away and only the rim
     light stays. The warm beak and feet plus the eye are what stop a grey blob reading as a rock. -->
<template id="pigeonSprite">
    <svg viewBox="0 0 40 40" aria-hidden="true">
        <g class="pig-all">
            <g class="pig-tail">
                <path d="M 28.6,24.6 L 37.6,25.4 L 38.4,30.4 L 28.6,28.4 Z" fill="#555b65"/>
            </g>
            <ellipse cx="20.6" cy="22.6" rx="8.8" ry="8" fill="#666c76"/>
            <ellipse cx="14.6" cy="22.4" rx="5.8" ry="7" fill="#7b818c"/>
            <g class="pig-wing">
                <ellipse cx="22" cy="22.8" rx="6.4" ry="4.4" fill="#565c66"
                         transform="rotate(4 22 22.8)"/>
            </g>
            <!-- Neck and head nest so two motions can run at once: the neck carries the walking
                 bob, the head carries the much slower peck. One element cannot animate
                 `transform` twice. -->
            <g class="pig-neck">
                <path d="M 13.6,18.6 L 12.4,13" fill="none" stroke="#5d636d" stroke-width="5.8"
                      stroke-linecap="round"/>
                <g class="pig-head">
                    <circle cx="11.8" cy="11.6" r="4.4" fill="#4e535c"/>
                    <ellipse cx="13.2" cy="15.4" rx="2.4" ry="2.2" fill="#3f6b63" opacity="0.45"/>
                    <path d="M 7.8,11.2 L 3.8,12.4 L 7.8,13.8 Z" fill="#c08a4e"/>
                    <circle cx="10.4" cy="10.4" r="0.95" fill="#0f1013"/>
                </g>
            </g>
            <g class="pig-leg pig-leg-front">
                <path d="M 17.6,29.6 L 16.8,36.4" fill="none" stroke="#b0793f" stroke-width="1.5"
                      stroke-linecap="round"/>
                <path d="M 14.2,37.3 L 19,37.3" fill="none" stroke="#b0793f" stroke-width="1.5"
                      stroke-linecap="round"/>
            </g>
            <g class="pig-leg pig-leg-back">
                <path d="M 22,29.8 L 22.6,36.4" fill="none" stroke="#b0793f" stroke-width="1.5"
                      stroke-linecap="round"/>
                <path d="M 20.2,37.3 L 25,37.3" fill="none" stroke="#b0793f" stroke-width="1.5"
                      stroke-linecap="round"/>
            </g>
        </g>
    </svg>
</template>

<!-- The crow that works the air, cloned once per flying bird by generateLevel(). Same template
     pattern and the same class-not-id rule as the pigeon, for the same reason: there are many.
     Authored facing LEFT with the wings at a neutral spread; the flap rotates each wing group
     about the shoulder at (17.5,20). No red outline any more — the city's rim light like
     everything else alive up here, with a deep brown eye rather than a warning colour. The greys
     run from the far wing (darkest) up through body and tail to the near wing, so the layers stay
     separable against a night sky; true black lost them against it. Its threat reads from the fact
     that it is flying straight at you. -->
<template id="crowSprite">
    <svg viewBox="0 0 40 40" aria-hidden="true">
        <g class="crw-all">
            <!-- Far wing first: it sits behind the body, and is darkest so the two never merge -->
            <g class="crw-wing-far">
                <path d="M 17.5,20 C 22,16.5 28.5,13.5 35,13 C 29.5,17 24.5,20.4 20,22.6 Z"
                      fill="#23252c"/>
            </g>
            <g class="crw-tail">
                <path d="M 27.5,20.6 L 37.5,18.2 L 37.8,23.6 L 27.5,22.8 Z" fill="#2a2c34"/>
            </g>
            <ellipse cx="20" cy="21" rx="9" ry="4.2" fill="#2f323a"
                     transform="rotate(-5 20 21)"/>
            <g class="crw-head">
                <circle cx="11.4" cy="19.4" r="3.4" fill="#2f323a"/>
                <path d="M 8.4,18.8 L 3.8,20 L 8.4,21.2 Z" fill="#474b54"/>
                <circle cx="10.4" cy="18.6" r="1" fill="#1e1409"/>
            </g>
            <!-- Near wing last: drawn over the body, so the downstroke breaks his outline -->
            <g class="crw-wing-near">
                <path d="M 17.5,20 C 22,15 29,11 36,10 C 30,15 25,19 20,22 Z" fill="#3b3f48"/>
            </g>
        </g>
    </svg>
</template>

<!-- Load Game Logic Files -->
<script src="map.js"></script>
<script src="game.js"></script>
</body>
</html>
